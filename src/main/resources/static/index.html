<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAR NAILS - Gestor de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        header { background: #c2185b; }
        .badge-PENDIENTE  { background: #fff8e1; color: #f57f17; }
        .badge-CONFIRMADA { background: #e8f5e9; color: #2e7d32; }
        .badge-CANCELADA  { background: #ffebee; color: #c62828; }
        .badge-COMPLETADA { background: #e3f2fd; color: #1565c0; }
    </style>
</head>
<body>

<header class="text-white py-3 mb-4">
    <div class="container text-center">
        <h1 class="fw-bold mb-0">ROAR NAILS</h1>
        <p class="mb-0 opacity-75">Gestor de citas</p>
    </div>
</header>

<main class="container">
    <div class="row g-4">

        <!-- Agendar cita -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-danger mb-3">Agendar cita</h5>

                    <label class="form-label">Cliente</label>
                    <select id="select-cliente" class="form-select mb-2">
                        <option value="">Selecciona un cliente...</option>
                    </select>

                    <label class="form-label">Servicio</label>
                    <select id="select-servicio" class="form-select mb-2">
                        <option value="">Selecciona un servicio...</option>
                    </select>

                    <label class="form-label">Fecha</label>
                    <input type="date" id="input-fecha" class="form-control mb-2">

                    <label class="form-label">Hora</label>
                    <input type="time" id="input-hora" class="form-control mb-3">

                    <button onclick="agendarCita()" class="btn btn-danger w-100">Agendar cita</button>
                    <div class="mt-2 small" id="msg-cita"></div>
                </div>
            </div>
        </div>

        <!-- Nuevo cliente -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-danger mb-3">Nuevo cliente</h5>

                    <label class="form-label">Nombre</label>
                    <input type="text" id="input-nombre" class="form-control mb-2" placeholder="Nombre completo">

                    <label class="form-label">Teléfono</label>
                    <input type="text" id="input-telefono" class="form-control mb-2" placeholder="8112345678">

                    <label class="form-label">Email</label>
                    <input type="email" id="input-email" class="form-control mb-3" placeholder="correo@email.com">

                    <button onclick="crearCliente()" class="btn btn-danger w-100">Registrar cliente</button>
                    <div class="mt-2 small" id="msg-cliente"></div>
                </div>
            </div>
        </div>

        <!-- Citas del día -->
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-danger mb-3">Citas del día</h5>
                    <div class="d-flex gap-2 align-items-end mb-3">
                        <div class="flex-grow-1">
                            <label class="form-label">Fecha</label>
                            <input type="date" id="input-fecha-busqueda" class="form-control">
                        </div>
                        <button onclick="buscarCitas()" class="btn btn-outline-danger">Buscar</button>
                    </div>

                    <table class="table table-hover table-sm">
                        <thead class="table-light">
                        <tr>
                            <th>Hora</th>
                            <th>Cliente</th>
                            <th>Servicio</th>
                            <th>Precio</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="tabla-citas">
                        <tr><td colspan="6" class="text-center text-muted">Selecciona una fecha</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API = 'http://localhost:8080/api';

    function badgeColor(estado) {
        const map = {
            PENDIENTE:  { bg: '#fff8e1', text: '#f57f17' },
            CONFIRMADA: { bg: '#e8f5e9', text: '#2e7d32' },
            CANCELADA:  { bg: '#ffebee', text: '#c62828' },
            COMPLETADA: { bg: '#e3f2fd', text: '#1565c0' }
        };
        return map[estado] || { bg: '#eee', text: '#333' };
    }

    async function cargarSelects() {
        const [clientes, servicios] = await Promise.all([
            fetch(`${API}/clientes`).then(r => r.json()),
            fetch(`${API}/servicios`).then(r => r.json())
        ]);

        const sc = document.getElementById('select-cliente');
        clientes.forEach(c => {
            sc.innerHTML += `<option value="${c.id}">${c.nombre} — ${c.telefono}</option>`;
        });

        const ss = document.getElementById('select-servicio');
        servicios.forEach(s => {
            ss.innerHTML += `<option value="${s.id}">${s.nombre} — $${s.precio}</option>`;
        });
    }

    async function agendarCita() {
        const clienteId  = document.getElementById('select-cliente').value;
        const servicioId = document.getElementById('select-servicio').value;
        const fecha      = document.getElementById('input-fecha').value;
        const hora       = document.getElementById('input-hora').value;
        const msg        = document.getElementById('msg-cita');

        if (!clienteId || !servicioId || !fecha || !hora) {
            msg.style.color = '#c62828';
            msg.textContent = 'Completa todos los campos.';
            return;
        }

        const res = await fetch(`${API}/citas`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                cliente:  { id: parseInt(clienteId) },
                servicio: { id: parseInt(servicioId) },
                fecha,
                hora: hora + ':00'
            })
        });

        if (res.ok) {
            msg.style.color = '#2e7d32';
            msg.textContent = 'Cita agendada correctamente.';
        } else {
            msg.style.color = '#c62828';
            msg.textContent = 'Error al agendar la cita.';
        }
    }

    async function crearCliente() {
        const nombre   = document.getElementById('input-nombre').value;
        const telefono = document.getElementById('input-telefono').value;
        const email    = document.getElementById('input-email').value;
        const msg      = document.getElementById('msg-cliente');

        if (!nombre || !telefono) {
            msg.style.color = '#c62828';
            msg.textContent = 'Nombre y teléfono son obligatorios.';
            return;
        }

        const res = await fetch(`${API}/clientes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, telefono, email })
        });

        if (res.ok) {
            msg.style.color = '#2e7d32';
            msg.textContent = 'Cliente registrado correctamente.';
            document.getElementById('input-nombre').value = '';
            document.getElementById('input-telefono').value = '';
            document.getElementById('input-email').value = '';
            cargarSelects();
        } else {
            msg.style.color = '#c62828';
            msg.textContent = 'Error al registrar el cliente.';
        }
    }

    async function buscarCitas() {
        const fecha = document.getElementById('input-fecha-busqueda').value;
        if (!fecha) return;

        const citas = await fetch(`${API}/citas/fecha/${fecha}`).then(r => r.json());
        const tbody = document.getElementById('tabla-citas');

        if (citas.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No hay citas para esta fecha</td></tr>`;
            return;
        }

        tbody.innerHTML = citas.map(c => `
        <tr>
            <td>${c.hora.substring(0, 5)}</td>
            <td>${c.cliente.nombre}</td>
            <td>${c.servicio.nombre}</td>
            <td>$${c.servicio.precio}</td>
            <td><span class="badge" style="background:${badgeColor(c.estado).bg};color:${badgeColor(c.estado).text}">${c.estado}</span></td>
            <td>
                <button onclick="cambiarEstado(${c.id}, 'confirmar')" class="btn btn-success btn-sm">Confirmar</button>
                <button onclick="cambiarEstado(${c.id}, 'cancelar')" class="btn btn-danger btn-sm">Cancelar</button>
            </td>
        </tr>
    `).join('');
    }

    async function cambiarEstado(id, accion) {
        await fetch(`${API}/citas/${id}/${accion}`, { method: 'PUT' });
        buscarCitas();
    }

    cargarSelects();
</script>

</body>
</body>

</html>
